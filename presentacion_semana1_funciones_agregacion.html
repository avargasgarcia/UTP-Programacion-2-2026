<script>
(function(){

function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

// tiny SQL highlighter
const SQL_KEYWORDS = ["SELECT","FROM","WHERE","GROUP BY","HAVING","ORDER BY","AS","AND","OR","NOT","BY",
  "COUNT","SUM","AVG","MAX","MIN","ROUND","LIMIT","DESC","ASC","NULL","INSERT","INTO","VALUES","UPDATE","SET","DELETE","JOIN"];
function highlightSql(line){
  let out = esc(line);
  // comments
  const commentMatch = out.match(/(--.*)$/);
  let comment = "";
  if(commentMatch){
    comment = commentMatch[1];
    out = out.slice(0, commentMatch.index);
  }
  // strings
  out = out.replace(/('([^']*)')/g, '<span class="s">$1</span>');
  // keywords (word-boundary, longest first)
  const kws = [...SQL_KEYWORDS].sort((a,b)=>b.length-a.length);
  kws.forEach(k=>{
    const re = new RegExp('\\b' + k.replace(' ', '\\s+') + '\\b', 'gi');
    out = out.replace(re, m => '<span class="k">' + m.toUpperCase() + '</span>');
  });
  if(comment) out += '<span class="c">' + esc(comment) + '</span>';
  return out;
}
function codeBlock(lines){
  return '<pre class="code">' + lines.map(highlightSql).join('\n') + '</pre>';
}

let uid = 0;
function nextId(prefix){ uid++; return prefix + uid; }

// ---------- Reveal component ----------
function reveal(label, html){
  const id = nextId('rv');
  return `
  <div>

    <div class="reveal-box" id="${id}">${html}</div>

}

// ---------- Tabs component ----------
function tabs(groupId, items){
  const tabBtns = items.map((it,i)=>`<button class="tab ${i===0?'active':''}" data-tabgroup="${groupId}" data-tabidx="${i}">${it.label}</button>`).join('');
  const panels = items.map((it,i)=>`<div class="tabpanel ${i===0?'active':''}" data-tabgroup="${groupId}" data-tabidx="${i}">${it.body}</div>`).join('');
  return `<div class="tabs">${tabBtns}</div>${panels}`;
}

// ---------- Quiz component ----------
function quiz(qid, question, choices, correctIdx, okMsg, noMsg){
  const items = choices.map((c,i)=>`<button class="choice" data-quiz="${qid}" data-idx="${i}"><span class="box"></span><span>${c}</span></button>`).join('');

    <div class="choice-list">${items}</div>
    <div class="feedback" id="fb-${qid}"></div>
  </div>`;
}

// =========================================================
// RENDER
// =========================================================
const viewport = document.getElementById('viewport');
const dotsEl = document.getElementById('dots');
let current = 0;

slides.forEach((s, i) => {
  const el = document.createElement('div');
  el.className = 'slide' + (s.section ? ' section' : '');
  el.id = 'slide-' + i;
  el.innerHTML = `<div class="slide-inner">
    ${s.eyebrow ? `<div class="eyebrow">${s.eyebrow}</div>` : ''}
    <h2>${s.title}</h2>
    ${s.body}
    <footer class="slide-foot"></footer>
  </div>`;
  if (s.section) {
    el.style.setProperty('--sec', '1');
  }
  viewport.appendChild(el);

  const dot = document.createElement('button');
  dot.className = 'dot' + (s.section ? ' section' : '');
  dot.setAttribute('aria-label', 'Ir a diapositiva ' + (i + 1));
  dot.addEventListener('click', () => goTo(i));
  dotsEl.appendChild(dot);
});

const total = slides.length;

function pad(n){ return String(n).padStart(2,'0'); }

function render(){
  slides.forEach((s,i)=>{
    const el = document.getElementById('slide-'+i);
    el.classList.toggle('active', i===current);
  });
  const dots = dotsEl.querySelectorAll('.dot');
  dots.forEach((d,i)=> d.classList.toggle('active', i===current));
  document.getElementById('counter').textContent = pad(current+1) + '/' + pad(total);
  document.getElementById('progress-fill').style.width = ((current) / (total-1) * 100) + '%';
  document.getElementById('btn-prev').disabled = current===0;
  document.getElementById('btn-next').disabled = current===total-1;
  document.getElementById('btn-next').classList.toggle('primary', current!==total-1);
  // scroll active dot into view
  const activeDot = dots[current];
  if (activeDot && activeDot.scrollIntoView) activeDot.scrollIntoView({block:'nearest', inline:'center'});
}

function goTo(i){
  current = Math.max(0, Math.min(total-1, i));
  render();
}

document.getElementById('btn-prev').addEventListener('click', ()=>goTo(current-1));
document.getElementById('btn-next').addEventListener('click', ()=>goTo(current+1));
document.addEventListener('keydown', (e)=>{
  if(e.key==='ArrowRight' || e.key===' '){ goTo(current+1); }
  else if(e.key==='ArrowLeft'){ goTo(current-1); }
});

// swipe support
let touchX = null;
viewport.addEventListener('touchstart', e=>{ touchX = e.touches[0].clientX; }, {passive:true});
viewport.addEventListener('touchend', e=>{
  if(touchX===null) return;
  const dx = e.changedTouches[0].clientX - touchX;
  if(Math.abs(dx) > 50){ dx < 0 ? goTo(current+1) : goTo(current-1); }
  touchX = null;
}, {passive:true});

// ---------- Interactive component wiring (event delegation) ----------
document.addEventListener('click', (e)=>{
  // reveal
  const rv = e.target.closest('[data-reveal]');
  if(rv){
    const box = document.getElementById(rv.getAttribute('data-reveal'));
    const showing = box.classList.toggle('show');
    rv.textContent = showing ? rv.getAttribute('data-hide') : rv.getAttribute('data-show');
    return;
  }
  // tabs
  const tabBtn = e.target.closest('.tab');
  if(tabBtn){
    const group = tabBtn.getAttribute('data-tabgroup');
    const idx = tabBtn.getAttribute('data-tabidx');
    document.querySelectorAll(`.tab[data-tabgroup="${group}"]`).forEach(b=>b.classList.toggle('active', b===tabBtn));
    document.querySelectorAll(`.tabpanel[data-tabgroup="${group}"]`).forEach(p=>p.classList.toggle('active', p.getAttribute('data-tabidx')===idx));
    return;
  }
  // steps
  const step = e.target.closest('.step');
  if(step){
    const track = step.parentElement;
    track.querySelectorAll('.step').forEach(s=>s.classList.toggle('active', s===step));
    return;
  }
  // quiz choice
  const choice = e.target.closest('.choice');
  if(choice){
    const root = choice.closest('[data-quizroot]');
    if(root.hasAttribute('data-answered')) return;
    root.setAttribute('data-answered','1');
    const correctIdx = root.getAttribute('data-correct');
    const idx = choice.getAttribute('data-idx');
    const all = root.querySelectorAll('.choice');
    all.forEach(c=>{
      c.setAttribute('disabled','');
      if(c.getAttribute('data-idx')===correctIdx) c.classList.add('correct');
    });
    const fb = root.querySelector('.feedback');
    if(idx===correctIdx){
      fb.textContent = '✓ ¡Correcto!';
      fb.className = 'feedback show ok';
    } else {
      choice.classList.add('wrong');
      fb.textContent = '✗ No es correcto — se resaltó la respuesta correcta.';
      fb.className = 'feedback show no';
    }
    return;
  }
});

render();
})();
</script>
